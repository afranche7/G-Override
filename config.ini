; G-Override shared config, read by both Helpers (Windows: AutoHotkey, macOS: Hammerspoon).
; Machine-specific overrides go in config.local.ini (git-ignored, same sections and keys).
; The installer writes config.local.ini; you can edit it by hand too.

[triggers]
; The Trigger Key each Button emits (set in the mouse's Onboard Profile).
; Format: an optional modifier prefix (ctrl+alt+shift+) followed by a key, e.g. F17 or ctrl+alt+shift+F10.
focus_claude=F17
send_to_claude=F18
prompt_palette=F19

[claude]
; Windows: MSIX AppUserModelID used to launch the Claude App (the installer resolves it).
windows_app_id=Claude_pzs8sxrjxfjjc!Claude
windows_exe=Claude.exe
; Only windows whose process path contains this count as the Claude App, never the `claude` CLI.
windows_path_match=\WindowsApps\Claude_
; macOS
mac_bundle_id=com.anthropic.claudefordesktop
mac_app_name=Claude

[copy]
; Windows apps (process names) that use the terminal copy key, so Ctrl+C never interrupts anything.
windows_terminals=WindowsTerminal.exe,powershell.exe,pwsh.exe,cmd.exe,conhost.exe,OpenConsole.exe,wezterm-gui.exe,alacritty.exe,mintty.exe,Hyper.exe,Tabby.exe
windows_terminal_copy_key=ctrl+shift+c
windows_default_copy_key=ctrl+c

[timing]
copy_timeout_ms=400
snip_timeout_ms=30000
window_snip_timeout_ms=2000
launch_timeout_ms=15000
paste_settle_ms=250

[debug]
; 1 = show a toast naming each Trigger Key received (used by the button test).
enabled=0

[palette]
; The Prompt Palette file, shared by both Helpers. Relative paths are resolved from the repo root.
; Edits are picked up the next time the palette opens; no reinstall or reload needed.
file=palette.md

[skills]
; The Main Flow skills the Prompt Palette's commands rely on. The installers install Matt Pocock's skills
; when none of these are found, and --doctor reports each one.
main_flow=grill-with-docs,to-spec,to-tickets,implement,code-review,retro
